<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kids Flashcards • Offline</title>
    <meta name="robots" content="noindex" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#2563eb" />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        font-family: 'Baloo 2', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #f4f7ff;
        color: #0f172a;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        box-sizing: border-box;
        background: radial-gradient(circle at 15% 15%, rgba(125, 224, 213, 0.35), transparent 35%),
          radial-gradient(circle at 85% 10%, rgba(255, 209, 102, 0.3), transparent 30%),
          radial-gradient(circle at 70% 90%, rgba(255, 126, 182, 0.2), transparent 40%),
          #f4f7ff;
      }
      .card {
        max-width: 520px;
        padding: 2rem;
        background: #ffffff;
        border-radius: 20px;
        box-shadow: 0 16px 32px rgba(15, 23, 42, 0.08);
        border: 1px solid rgba(15, 23, 42, 0.06);
        text-align: center;
      }
      .card img {
        display: block;
        margin: 0 auto 0.75rem;
      }
      .card h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(1.8rem, 4vw, 2.3rem);
        line-height: 1.15;
      }
      .card p {
        margin: 0 0 1.25rem;
        color: #475569;
        font-weight: 600;
      }
      .cta {
        display: inline-block;
        padding: 0.8rem 1.3rem;
        border-radius: 14px;
        background: #2563eb;
        color: #ffffff;
        font-weight: 800;
        text-decoration: none;
        box-shadow: 0 10px 24px rgba(37, 99, 235, 0.3);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/logo.svg" width="80" height="80" alt="" />
      <h1>Offline right now</h1>
      <p>Your cards, children and progress are saved on this device, so Kids Flashcards still works without the internet.</p>
      <a class="cta" href="/">Open Kids Flashcards</a>
    </main>
  </body>
</html>
